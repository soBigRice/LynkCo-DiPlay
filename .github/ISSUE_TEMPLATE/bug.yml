name: Connection, display or audio problem
description: Help us reproduce an issue on your head unit.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: 'Test while parked. Reports are public: review diagnostic files and remove personal information before attaching them. Never post credentials.'
  - type: input
    id: version
    attributes: {label: LynkCo CarPlay version, placeholder: '0.2.12-lynk-osn2-r1 (code 43)'}
    validations: {required: true}
  - type: input
    id: car
    attributes: {label: Car and head-unit model, placeholder: 'Car model/year, head unit, OS N/Android version and exact firmware'}
    validations: {required: true}
  - type: input
    id: phone
    attributes: {label: iPhone model and exact iOS version}
    validations: {required: true}
  - type: dropdown
    id: transport
    attributes:
      label: Connection
      options: [USB, 'Wireless: automatic temporary hotspot (experimental)', 'Wireless: built-in car hotspot (experimental)', 'Wireless: Wi-Fi Direct', 'Wireless: Existing Wi-Fi / Same LAN', Both, 'Other / unsure']
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes:
      label: What happened and how to reproduce it
      description: 'Include expected behavior, steps, relevant settings and the approximate failure time. For wireless, include the backend, band/channel if shown, and whether the car is also connected to another Wi-Fi network. For Same LAN, include the router model and whether client isolation is enabled.'
    validations: {required: true}
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic report or recording
      description: 'Update to the latest Lynk release and reproduce while parked, then Settings → Support → Diagnostics → Save diagnostic report. Android 9 provides View/Share for the locally saved report; Android 10+ normally uses Downloads. Include the approximate failure time. Review the text before attaching it and never include your hotspot password or personal information. Wireless is still experimental.'
